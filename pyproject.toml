[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "os-control"
version = "0.1.0"
description = "Accessibility-Powered AI Agent Tool for Operating System Interaction"
readme = "README.md"
authors = [{ name = "OS-Control Team" }]
requires-python = ">=3.10"
dependencies = [
    "comtypes>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "pillow>=10.0.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "ollama>=0.2.0",
]

